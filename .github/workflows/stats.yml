name: Download stats

# Раз в час записывает счётчики скачиваний из GitHub Releases в stats.json.
on:
  schedule:
    - cron: "17 * * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot download counts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/snapshot.js
      - name: Commit if changed
        run: |
          if git diff --quiet stats.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git commit -m "stats: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
